<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240">
  <!-- Serat kayu walnut: noise yang ditarik memanjang horizontal. -->
  <filter id="serat" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 -1.6 1.15"/>
  </filter>
  <rect width="600" height="240" fill="#4A3324"/>
  <rect width="600" height="240" filter="url(#serat)"/>
</svg>
